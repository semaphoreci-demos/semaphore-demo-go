version: v1.0
name: Semaphore Semgrep CE Example
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: Semgrep
    task:
      jobs:
        - name: Semgrep CE Scan
          commands:
            - checkout
            - sudo pip install semgrep
            - semgrep scan --junit-xml --output=report.xml
            - '[[ -f report.xml ]] && test-results publish report.xml'
            - test-results command-metrics COMMAND.md
            - test-results resource-metrics RESOURCE.md
            - cat COMMAND.md RESOURCE.md > REPORT.md
            - artifact push workflow -d .semaphore/REPORT.md REPORT.md
  - name: Unit tests
    task:
      jobs:
        - name: Unit tests
          commands:
            - checkout
            - cache restore
            - go mod download
            - cache store
            - go test ./...
after_pipeline:
  task:
    jobs:
      - name: Publish Results
        commands:
          - test-results gen-pipeline-report
