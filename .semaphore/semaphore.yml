version: v1.0
name: Semaphore Go CI example
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: Build project
    task:
      jobs:
        - name: go get & build
          commands:
            - checkout
            - sem-version go 1.19
            - go get
            - go build -o ./bin/main
            - cache store $(checksum main.go) bin
  - name: Check code style
    task:
      jobs:
        - name: gofmt
          commands:
            - checkout
            - sem-version go 1.19
            - gofmt main.go | diff --ignore-tab-expansion main.go -
  - name: Run tests
    task:
      prologue:
        commands:
          - checkout
          - sem-version go 1.19
      jobs:
        - name: go test
          commands:
            - sem-service start postgres
            - psql -p 5432 -h localhost -U postgres -c "CREATE DATABASE s2"
            - go install gotest.tools/gotestsum@latest
            - gotestsum --junitfile junit.xml ./...
        - name: Test web server
          commands:
            - cache restore $(checksum main.go)
            - ./bin/main 8001 &
            - 'curl --silent localhost:8001/time | grep "The current time is"'
      epilogue:
        always:
          commands:
            - test-results publish junit.xml
  - name: Static Analysis
    task:
      jobs:
        - name: Semgrep CE Scan
          commands:
            - checkout
            - sudo pip install semgrep
            - semgrep scan --junit-xml --output=report.xml
            - '[[ -f report.xml ]] && test-results publish report.xml'
        - name: Coverage report
          commands:
            - cache restore $(checksum main.go)
            - go install github.com/jandelgado/gcov2lcov@latest
            - go install github.com/securego/gosec/v2/cmd/gosec@v2.19.0
            - go install golang.org/x/lint/golint@latest
            - go test -coverprofile=c.out ./...
            - gcov2lcov -infile=c.out -outfile=coverage.lcov
            - scripts/lcov-to-md
            - artifact push workflow -d .semaphore/REPORT.md COVERAGE.md

  - name: Unit tests
    task:
      jobs:
        - name: Unit tests
          commands:
            - checkout
            - cache restore
            - go mod download
            - cache store
            - go test ./...
after_pipeline:
  task:
    jobs:
      - name: Publish Results
        commands:
          - test-results gen-pipeline-report
